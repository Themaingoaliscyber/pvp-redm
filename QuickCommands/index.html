<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lobby Commands HUD</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Asigură-te că HUD-ul nu interferează cu restul UI-ului */
    #hud {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- HUD container (gol pentru eventuale extensii) -->
  <div id="hud"></div>

  <!-- Lista de comenzi afișată când nu ești într-o arenă -->
  <div id="lobbyCommands"
       style="position: absolute;
              top: 17vh;
              right: 1vw;
              display: none;
              flex-direction: column;
              gap: 4px;
              z-index: 1000;
              align-items: flex-end;">
  </div>

  <!-- Scriptul care gestionează comenzile -->
  <script src="script.js"></script>
</body>
</html>
