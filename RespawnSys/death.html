<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Screen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="death-overlay" aria-hidden="true">
        <div id="death-screen">
            <div class="monitor" aria-hidden="true">
                <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                    viewBox="0 0 500 200" style="enable-background:new 0 0 500 200;" xml:space="preserve">
                    <g>
                        <polyline class="ekg" points="486.6,113.8 328.2,113.8 310.3,132.3 296,70.7 246.8,127.4 241.6,120.2 233.9,166.4
                            227,27.6 213.2,118.3 211.8,112.3 205.1,126.1 198.2,108.5 194.1,124.4 184.5,92.9 174.1,113 4.3,113" />
                    </g>
                </svg>
            </div>

            <div id="death-message">
                <h2><span class="highlight">NOW</span> YOU ARE <span class="outline">DEAD</span></h2>
                <p class="respawn-hint">Press <kbd>E</kbd> to respawn.</p>
                <div class="death-actions">
                    <button id="respawn-action" class="action-btn action-btn-respawn" type="button">
                        <kbd>E</kbd>
                        <span>Respawn</span>
                    </button>
                    <button id="spectate-action" class="action-btn action-btn-spectate" type="button">
                        <kbd>G</kbd>
                        <span>Spectate Killer</span>
                    </button>
                </div>
                <p class="spectate-note">Spectator mode is available in Public and Private arenas.</p>
            </div>

            <div id="killer-card" aria-label="Elimination report">
                <div class="card-title">
                    <span>Elimination Report</span>
                    <span id="report-lobby" class="card-lobby" hidden></span>
                </div>
                <div class="card-grid">
                    <div class="label">Killer</div>
                    <div id="killer-name" class="value">Unknown</div>

                    <div class="label">Weapon</div>
                    <div id="killer-weapon" class="value">Unknown</div>

                    <div class="label">Distance</div>
                    <div id="killer-distance" class="value">Unknown</div>
                </div>
            </div>
        </div>
    </div>

    <div id="spectator-overlay" aria-hidden="true">
        <div id="spectator-banner">
            <div class="spectator-head">
                <div class="spectator-badge">
                    <span class="spectator-dot" aria-hidden="true"></span>
                    <span class="spectator-title">Spectator Mode</span>
                </div>
                <div class="spectator-exit">
                    <span class="spectator-exit-text">Exit</span>
                    <kbd>ESC</kbd>
                </div>
            </div>
            <div class="spectator-main">
                <span class="spectator-label">Watching</span>
                <span id="spectator-target-name" class="spectator-target">Killer</span>
            </div>
            <div class="spectator-hint">
                Press <kbd>ESC</kbd> to leave spectator mode and return to your arena
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
